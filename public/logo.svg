<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- Clod's "logo": a lovingly botched MS-Paint asterisk. Any resemblance to a real brand is purely aspirational. -->
  <g transform="rotate(-9 50 52)">
    <!-- badly offset drop shadow -->
    <g stroke="#5b3a29" stroke-linecap="round" fill="none" opacity=".55" transform="translate(6 5)">
      <path d="M50 52 L49 9" stroke-width="13"/>
      <path d="M50 52 L88 31" stroke-width="9"/>
      <path d="M50 52 L84 83" stroke-width="15"/>
      <path d="M50 52 L46 93" stroke-width="8"/>
      <path d="M50 52 L13 79" stroke-width="12"/>
      <path d="M50 52 L9 40" stroke-width="10"/>
      <path d="M50 52 L24 14" stroke-width="7"/>
    </g>
    <!-- the wobbly rays, deliberately uneven -->
    <g stroke="#d97757" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <path d="M50 52 Q46 30 49 9" stroke-width="13"/>
      <path d="M50 52 Q70 45 88 31" stroke-width="9"/>
      <path d="M50 52 Q63 70 84 83" stroke-width="15"/>
      <path d="M50 52 L46 93" stroke-width="8"/>
      <path d="M50 52 Q30 62 13 79" stroke-width="12"/>
      <path d="M50 52 Q31 50 9 40" stroke-width="10"/>
      <path d="M50 52 Q40 30 24 14" stroke-width="7"/>
    </g>
    <!-- paint bucket spill blob in the middle -->
    <path d="M38 49 C36 38 55 36 61 44 C68 52 60 66 49 63 C41 61 39 57 38 49 Z" fill="#e8957a" stroke="#b85a3c" stroke-width="2.5"/>
    <!-- googly eye -->
    <circle cx="49" cy="50" r="8" fill="#fff" stroke="#222" stroke-width="2"/>
    <circle cx="52" cy="53" r="3.6" fill="#111"/>
    <!-- smudge -->
    <path d="M70 14 q4 -3 7 1" stroke="#d97757" stroke-width="3" fill="none" stroke-linecap="round"/>
  </g>
</svg>
