<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Clod</title>
  <link rel="icon" href="/logo.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <aside id="sidebar">
    <div class="brand">
      <img src="/logo.svg" alt="" class="brand-logo" />
      <span class="wordmark">Clod</span>
      <button id="toggle-sidebar" class="icon-btn" title="Toggel sidebar" aria-label="Toggel sidebar">☰</button>
    </div>
    <button id="new-chat" class="new-chat"><span>＋</span> New chatt</button>
    <div class="section-label">Recnets</div>
    <nav id="conversation-list"></nav>
  </aside>

  <main id="main">
    <button id="open-sidebar" class="icon-btn floating" title="Opne sidebar" aria-label="Opne sidebar">☰</button>

    <section id="welcome">
      <img src="/logo.svg" alt="" class="welcome-logo" />
      <h1 id="greeting">Hey ther</h1>
    </section>

    <section id="messages" aria-live="polite"></section>

    <form id="composer">
      <div id="attachments" hidden></div>
      <textarea id="prompt" rows="1" placeholder="How can Clod halp you todya?" autofocus></textarea>
      <div class="composer-bar">
        <div class="pickers">
          <button id="attach" type="button" class="attach" title="Atach a pic (or just pasete it)" aria-label="Atach a pic">📎</button>
          <input id="file-input" type="file" accept="image/png,image/jpeg,image/webp,image/gif" multiple hidden />
          <select id="model" title="Model"></select>
          <select id="effort" title="Thinkin efort"></select>
        </div>
        <div class="composer-right">
          <button id="voice" type="button" class="voice-btn" title="Tlak to Clod (voice mode)" aria-label="Voice mode">🎙</button>
          <button id="send" type="submit" class="send" title="Sned" aria-label="Sned">↑</button>
        </div>
      </div>
    </form>
    <div class="disclaimer">Clod makes mistakes</div>
  </main>

  <div id="voice-mode" hidden>
    <button id="voice-orb" type="button" title="Tap to interupt / tlak" aria-label="Interupt">
      <img src="/logo.svg" alt="" />
    </button>
    <div id="voice-status">Lisening…</div>
    <div id="voice-caption"></div>
    <div class="voice-controls">
      <button id="voice-mute" type="button" title="Mute mic">🎙</button>
      <button id="voice-end" type="button" title="Hang up">✕</button>
    </div>
  </div>

  <script src="/markdown.js"></script>
  <script src="/app.js"></script>
</body>
</html>
