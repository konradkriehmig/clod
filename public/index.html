<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Clod</title>
  <link rel="icon" href="/logo.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <aside id="sidebar">
    <div class="brand">
      <img src="/logo.svg" alt="" class="brand-logo" />
      <span class="wordmark">Clod</span>
      <button id="toggle-sidebar" class="icon-btn" title="Toggle sidebar" aria-label="Toggle sidebar">☰</button>
    </div>
    <button id="new-chat" class="new-chat"><span>＋</span> New chat</button>
    <div class="section-label">Recents</div>
    <nav id="conversation-list"></nav>
    <div class="sidebar-footer">Clod can make mistakes. Like, a lot.</div>
  </aside>

  <main id="main">
    <button id="open-sidebar" class="icon-btn floating" title="Open sidebar" aria-label="Open sidebar">☰</button>

    <section id="welcome">
      <img src="/logo.svg" alt="" class="welcome-logo" />
      <h1 id="greeting">Hey there</h1>
    </section>

    <section id="messages" aria-live="polite"></section>

    <form id="composer">
      <textarea id="prompt" rows="1" placeholder="How can Clod help you today?" autofocus></textarea>
      <div class="composer-bar">
        <div class="pickers">
          <select id="model" title="Model"></select>
          <select id="effort" title="Thinking effort"></select>
        </div>
        <button id="send" type="submit" class="send" title="Send" aria-label="Send">↑</button>
      </div>
    </form>
    <div class="disclaimer">Clod is an unofficial knockoff chat UI powered by the GitHub Copilot SDK. Not affiliated with anyone respectable.</div>
  </main>

  <script src="/markdown.js"></script>
  <script src="/app.js"></script>
</body>
</html>
